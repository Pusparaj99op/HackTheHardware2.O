<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>VisionPilot Phone</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="phone">
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="status" id="status">connecting...</span>
      <span class="chip mono" id="fps">0 fps</span>
    </div>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas class="overlay" id="overlay"></canvas>
      <div class="start" id="start">
        <div class="stack">
          <p>Mount the phone on the car in <b>landscape</b> (Follow / Explore / Replay)<br>
             or hold it looking down at the car (Hand-held).</p>
          <button id="go">Start camera</button>
          <p class="muted" id="start-error"></p>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="modes" id="modes"></div>
      <div class="row">
        <select id="label" style="flex: 1"></select>
        <button id="clear">Clear</button>
      </div>
      <button class="kill" id="kill">ENGAGE (laptop drives)</button>
    </div>
  </div>
  <script type="module" src="/static/phone.js"></script>
</body>
</html>
